<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極簡風格 高效待辦清單 | Modern Todo List</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        darkCard: '#151c2c',
                        darkBorder: '#232d42',
                        accent: '#6366f1'
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fadeIn': 'fadeIn 0.3s ease-out forwards'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(8px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #0b0f19;
        }
        /* Glassmorphic card styling */
        .glass-panel {
            background: rgba(21, 28, 44, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-panel-hover:hover {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 8px 24px -4px rgba(99, 102, 241, 0.15);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }
        ::-webkit-scrollbar-thumb {
            background: #232d42;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white bg-[#0b0f19]">

    <!-- Decorative Top Glow -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-4xl h-48 bg-indigo-600/15 blur-[120px] pointer-events-none rounded-full z-0"></div>

    <!-- Header -->
    <header class="w-full border-b border-darkBorder/60 glass-panel sticky top-0 z-40">
        <div class="max-w-2xl mx-auto px-4 py-4 flex justify-between items-center relative z-10">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                    <i class="fa-solid fa-check-double text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white flex items-center gap-2">
                        高效待辦清單
                        <span class="text-[10px] bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 font-semibold px-2 py-0.5 rounded-full">v2.0</span>
                    </h1>
                    <p class="text-xs text-slate-400">專注重點 • 輕鬆勾選 • 自動儲存</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span id="date-display" class="text-xs text-slate-400 font-medium hidden sm:inline-flex items-center gap-1.5 bg-darkBg/80 px-3 py-1.5 rounded-xl border border-darkBorder">
                    <i class="fa-regular fa-calendar-check text-indigo-400"></i>
                    <span id="date-text"></span>
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-2xl w-full mx-auto px-4 py-8 relative z-10">

        <!-- Task Input Form -->
        <div class="glass-panel rounded-2xl p-5 shadow-2xl mb-6 relative overflow-hidden">
            <div class="absolute -right-8 -top-8 w-28 h-28 bg-indigo-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <form id="todo-form" class="space-y-3 relative">
                <div class="relative">
                    <input 
                        type="text" 
                        id="todo-input" 
                        placeholder="請輸入待辦事項內容..." 
                        autocomplete="off"
                        class="w-full bg-darkBg/90 border border-darkBorder text-slate-100 placeholder-slate-500 text-sm rounded-xl px-4 py-3.5 pl-11 focus:outline-none focus:ring-2 focus:ring-indigo-500/80 focus:border-transparent transition-all shadow-inner"
                    >
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-plus-circle text-indigo-400"></i>
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-3">
                    <!-- Category Selector -->
                    <div class="relative flex-1">
                        <select 
                            id="todo-category" 
                            class="w-full bg-darkBg/90 border border-darkBorder text-slate-300 text-xs rounded-xl px-3.5 py-2.5 appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500/80 cursor-pointer"
                        >
                            <option value="work">💼 工作職業</option>
                            <option value="personal" selected>🏠 日常生活</option>
                            <option value="study">📚 學習進修</option>
                            <option value="shopping">🛒 購物清單</option>
                            <option value="health">💪 健康運動</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400 text-xs">
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                    </div>

                    <!-- Priority Selector -->
                    <div class="relative flex-1">
                        <select 
                            id="todo-priority" 
                            class="w-full bg-darkBg/90 border border-darkBorder text-slate-300 text-xs rounded-xl px-3.5 py-2.5 appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500/80 cursor-pointer"
                        >
                            <option value="low">🟢 低優先級</option>
                            <option value="medium" selected>🟡 中優先級</option>
                            <option value="high">🔴 高優先級</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400 text-xs">
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button 
                        type="submit" 
                        class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium text-xs px-6 py-2.5 rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2 shrink-0 active:scale-95 cursor-pointer"
                    >
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                        <span>新增任務</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Dashboard Stats & Search Bar -->
        <div class="glass-panel rounded-2xl p-4 shadow-lg mb-6 flex flex-col gap-4">
            
            <!-- Progress Header -->
            <div>
                <div class="flex justify-between items-center text-xs text-slate-400 mb-2 font-medium">
                    <span class="flex items-center gap-1.5">
                        <i class="fa-solid fa-chart-line text-indigo-400"></i>
                        完成進度狀態
                    </span>
                    <span id="progress-text" class="font-mono text-indigo-300 font-semibold">0 / 0 (0%)</span>
                </div>
                <div class="w-full bg-darkBg rounded-full h-2.5 overflow-hidden border border-darkBorder/80 p-0.5">
                    <div id="progress-bar" class="bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-400 h-full rounded-full transition-all duration-500 shadow-sm" style="width: 0%"></div>
                </div>
            </div>

            <!-- Search and Filter Tool Row -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3 pt-3 border-t border-darkBorder/60">
                
                <!-- Search Input -->
                <div class="relative w-full sm:w-48">
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="搜尋待辦事項..." 
                        class="w-full bg-darkBg/80 border border-darkBorder text-slate-200 placeholder-slate-500 text-xs rounded-xl pl-8 pr-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500"
                    >
                    <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                </div>

                <!-- Filter Tabs -->
                <div class="flex bg-darkBg/90 p-1 rounded-xl border border-darkBorder w-full sm:w-auto">
                    <button data-filter="all" class="filter-btn flex-1 sm:flex-initial px-3.5 py-1.5 text-xs font-medium rounded-lg text-white bg-indigo-600 shadow transition-all cursor-pointer">全部</button>
                    <button data-filter="active" class="filter-btn flex-1 sm:flex-initial px-3.5 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer">進行中</button>
                    <button data-filter="completed" class="filter-btn flex-1 sm:flex-initial px-3.5 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer">已完成</button>
                </div>

                <!-- Batch Actions -->
                <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                    <button id="clear-completed" class="text-xs text-slate-400 hover:text-rose-400 transition-colors px-3 py-1.5 rounded-xl border border-darkBorder hover:border-rose-500/30 bg-darkBg/60 flex items-center gap-1.5 cursor-pointer">
                        <i class="fa-solid fa-trash-can text-xs"></i> 清除已完成
                    </button>
                </div>
            </div>
        </div>

        <!-- Task List Area -->
        <div class="space-y-3 min-h-[160px]" id="todo-list">
            <!-- Dynamic items will be injected here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-12 text-center animate-fadeIn">
            <div class="w-16 h-16 bg-darkCard border border-darkBorder rounded-2xl flex items-center justify-center text-slate-500 mb-3 shadow-inner">
                <i class="fa-solid fa-clipboard-check text-3xl text-indigo-400/60"></i>
            </div>
            <h3 class="text-sm font-semibold text-slate-300">目前沒有符合的待辦事項</h3>
            <p class="text-xs text-slate-500 mt-1">在上方新增一個新的任務，開始為您進行效率規劃吧！</p>
        </div>
    </main>

    <!-- Modal Dialog -->
    <div id="custom-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel border border-darkBorder rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="flex items-center space-x-3 mb-3">
                <div id="modal-icon-container" class="w-10 h-10 rounded-xl flex items-center justify-center bg-indigo-500/10 text-indigo-400 shrink-0">
                    <i id="modal-icon" class="fa-solid fa-circle-info text-lg"></i>
                </div>
                <h3 id="modal-title" class="text-base font-semibold text-white">提示訊息</h3>
            </div>
            <p id="modal-message" class="text-xs text-slate-300 mb-6 leading-relaxed"></p>
            <div class="flex justify-end space-x-2">
                <button id="modal-cancel" class="hidden px-4 py-2 text-xs font-medium text-slate-300 bg-darkBg border border-darkBorder rounded-xl hover:bg-darkBorder transition-all cursor-pointer">取消</button>
                <button id="modal-confirm" class="px-4 py-2 text-xs font-medium text-white bg-indigo-600 rounded-xl hover:bg-indigo-500 shadow-lg shadow-indigo-600/30 transition-all cursor-pointer">確定</button>
            </div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel border border-darkBorder rounded-2xl p-6 max-w-md w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-300" id="edit-modal-content">
            <h3 class="text-base font-semibold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-indigo-400"></i>
                編輯待辦事項
            </h3>
            <input 
                type="text" 
                id="edit-input" 
                class="w-full bg-darkBg border border-darkBorder text-slate-100 text-xs rounded-xl p-3 mb-4 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
            <div class="flex justify-end space-x-2">
                <button id="edit-cancel" class="px-4 py-2 text-xs font-medium text-slate-300 bg-darkBg border border-darkBorder rounded-xl hover:bg-darkBorder transition-all cursor-pointer">取消</button>
                <button id="edit-save" class="px-4 py-2 text-xs font-medium text-white bg-indigo-600 rounded-xl hover:bg-indigo-500 shadow-lg shadow-indigo-600/30 transition-all cursor-pointer">儲存變更</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full border-t border-darkBorder/40 py-4 glass-panel text-center text-xs text-slate-500 relative z-10">
        <p>高效雲端待辦事項 &copy; 2026 | 支援 LocalStorage 自動持久化儲存</p>
    </footer>

    <!-- App Logic -->
    <script>
        // DOM Elements
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoCategory = document.getElementById('todo-category');
        const todoPriority = document.getElementById('todo-priority');
        const todoList = document.getElementById('todo-list');
        const emptyState = document.getElementById('empty-state');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const clearCompletedBtn = document.getElementById('clear-completed');
        const searchInput = document.getElementById('search-input');
        const dateText = document.getElementById('date-text');

        // Modal Elements
        const customModal = document.getElementById('custom-modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalConfirm = document.getElementById('modal-confirm');
        const modalCancel = document.getElementById('modal-cancel');

        // Edit Modal Elements
        const editModal = document.getElementById('edit-modal');
        const editModalContent = document.getElementById('edit-modal-content');
        const editInput = document.getElementById('edit-input');
        const editCancel = document.getElementById('edit-cancel');
        const editSave = document.getElementById('edit-save');
        let currentEditId = null;

        // State Management
        let todos = JSON.parse(localStorage.getItem('antigravity_todos_v2')) || [
            { id: 1, text: '完成網頁待辦事項 UI 介面設計', completed: true, priority: 'high', category: 'work', date: '2026-03-20' },
            { id: 2, text: '測試完成狀態勾選與 LocalStorage 紀錄', completed: true, priority: 'medium', category: 'study', date: '2026-03-20' },
            { id: 3, text: '部署網頁至免費雲端託管平台', completed: false, priority: 'high', category: 'work', date: '2026-03-20' }
        ];
        let currentFilter = 'all';
        let searchQuery = '';

        // Initialize Date Display
        function updateDate() {
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
            const today = new Date().toLocaleDateString('zh-TW', options);
            dateText.textContent = today;
        }

        // Custom Modal Alert / Confirm
        function showAlert(title, message, isConfirm = false, onConfirm = null) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalCancel.classList.toggle('hidden', !isConfirm);
            
            customModal.classList.remove('hidden');
            setTimeout(() => {
                customModal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);

            const newConfirm = modalConfirm.cloneNode(true);
            modalConfirm.parentNode.replaceChild(newConfirm, modalConfirm);

            const newCancel = modalCancel.cloneNode(true);
            modalCancel.parentNode.replaceChild(newCancel, modalCancel);

            document.getElementById('modal-confirm').addEventListener('click', () => {
                closeModal();
                if (onConfirm) onConfirm();
            });

            document.getElementById('modal-cancel').addEventListener('click', () => {
                closeModal();
            });
        }

        function closeModal() {
            customModal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                customModal.classList.add('hidden');
            }, 300);
        }

        // Edit Modal Handlers
        function openEditModal(id, currentText) {
            currentEditId = id;
            editInput.value = currentText;
            editModal.classList.remove('hidden');
            setTimeout(() => {
                editModal.classList.remove('opacity-0');
                editModalContent.classList.remove('scale-95');
                editModalContent.classList.add('scale-100');
                editInput.focus();
            }, 10);
        }

        function closeEditModal() {
            editModal.classList.add('opacity-0');
            editModalContent.classList.remove('scale-100');
            editModalContent.classList.add('scale-95');
            setTimeout(() => {
                editModal.classList.add('hidden');
                currentEditId = null;
            }, 300);
        }

        editCancel.addEventListener('click', closeEditModal);
        editSave.addEventListener('click', () => {
            const val = editInput.value.trim();
            if (!val) {
                showAlert('提示', '待辦事項內容不能為空白！');
                return;
            }
            if (currentEditId) {
                todos = todos.map(t => t.id === currentEditId ? { ...t, text: val } : t);
                saveTodos();
                renderTodos();
                closeEditModal();
            }
        });

        // Save LocalStorage
        function saveTodos() {
            localStorage.setItem('antigravity_todos_v2', JSON.stringify(todos));
        }

        // Add Todo
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = todoInput.value.trim();
            if (!text) {
                showAlert('提醒', '請先輸入待辦事項內容再進行新增！');
                return;
            }

            const newTodo = {
                id: Date.now(),
                text: text,
                completed: false,
                priority: todoPriority.value,
                category: todoCategory.value,
                date: new Date().toLocaleDateString('zh-TW')
            };

            todos.unshift(newTodo);
            saveTodos();
            renderTodos();
            
            todoInput.value = '';
            todoInput.focus();
        });

        // Toggle Done
        window.toggleTodo = function(id) {
            todos = todos.map(todo => todo.id === id ? { ...todo, completed: !todo.completed } : todo);
            saveTodos();
            renderTodos();
        };

        // Delete Todo
        window.deleteTodo = function(id) {
            todos = todos.filter(todo => todo.id !== id);
            saveTodos();
            renderTodos();
        };

        // Trigger Edit
        window.editTodo = function(id) {
            const target = todos.find(t => t.id === id);
            if (target) {
                openEditModal(id, target.text);
            }
        };

        // Search Input Event
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderTodos();
        });

        // Filter Tabs
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow');
                    b.classList.add('text-slate-400');
                });
                e.target.classList.remove('text-slate-400');
                e.target.classList.add('bg-indigo-600', 'text-white', 'shadow');

                currentFilter = e.target.getAttribute('data-filter');
                renderTodos();
            });
        });

        // Clear Completed
        clearCompletedBtn.addEventListener('click', () => {
            const completedCount = todos.filter(t => t.completed).length;
            if (completedCount === 0) {
                showAlert('提示', '目前沒有已完成的任務可供清除。');
                return;
            }

            showAlert('確認清除', `確定要清除 ${completedCount} 項已完成的任務嗎？`, true, () => {
                todos = todos.filter(t => !t.completed);
                saveTodos();
                renderTodos();
            });
        });

        // Render Todo items
        function renderTodos() {
            // Filter logic
            let filtered = todos;
            if (currentFilter === 'active') {
                filtered = todos.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filtered = todos.filter(t => t.completed);
            }

            if (searchQuery) {
                filtered = filtered.filter(t => t.text.toLowerCase().includes(searchQuery));
            }

            // Stats
            const totalCount = todos.length;
            const completedCount = todos.filter(t => t.completed).length;
            const percent = totalCount === 0 ? 0 : Math.round((completedCount / totalCount) * 100);

            progressBar.style.width = `${percent}%`;
            progressText.textContent = `${completedCount} / ${totalCount} (${percent}%)`;

            // Empty state check
            if (filtered.length === 0) {
                todoList.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            const categoryMap = {
                work: { label: '工作', class: 'bg-blue-500/10 text-blue-400 border-blue-500/20' },
                personal: { label: '日常', class: 'bg-purple-500/10 text-purple-400 border-purple-500/20' },
                study: { label: '學習', class: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' },
                shopping: { label: '購物', class: 'bg-amber-500/10 text-amber-400 border-amber-500/20' },
                health: { label: '健康', class: 'bg-rose-500/10 text-rose-400 border-rose-500/20' }
            };

            const priorityMap = {
                low: { label: '低', dot: 'bg-emerald-500' },
                medium: { label: '中', dot: 'bg-amber-500' },
                high: { label: '高', dot: 'bg-rose-500' }
            };

            // Render DOM
            todoList.innerHTML = filtered.map(todo => {
                const cat = categoryMap[todo.category] || categoryMap.personal;
                const pri = priorityMap[todo.priority] || priorityMap.medium;

                return `
                    <div class="glass-panel glass-panel-hover rounded-2xl p-4 flex items-center justify-between gap-3 shadow-sm transition-all duration-200 animate-fadeIn group">
                        <div class="flex items-center space-x-3.5 flex-1 min-w-0">
                            <!-- Checkbox button -->
                            <button 
                                onclick="toggleTodo(${todo.id})"
                                class="w-6 h-6 rounded-lg border ${todo.completed ? 'bg-gradient-to-tr from-indigo-600 to-violet-600 border-indigo-500 text-white shadow-md shadow-indigo-600/30' : 'border-darkBorder bg-darkBg hover:border-indigo-500'} flex items-center justify-center shrink-0 transition-all cursor-pointer focus:outline-none"
                                title="${todo.completed ? '標記為未完成' : '標記為已完成'}"
                            >
                                ${todo.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                            </button>

                            <!-- Task Text & Metadata -->
                            <div class="flex flex-col min-w-0 flex-1">
                                <span class="text-sm truncate ${todo.completed ? 'line-through text-slate-500' : 'text-slate-100'} font-medium transition-colors">
                                    ${escapeHtml(todo.text)}
                                </span>
                                <div class="flex items-center space-x-2 mt-1">
                                    <span class="text-[10px] px-2 py-0.5 rounded-md border ${cat.class} font-medium">
                                        ${cat.label}
                                    </span>
                                    <span class="flex items-center space-x-1 text-[10px] text-slate-400">
                                        <span class="w-1.5 h-1.5 rounded-full ${pri.dot}"></span>
                                        <span>${pri.label}優先級</span>
                                    </span>
                                    <span class="text-[10px] text-slate-500 hidden sm:inline">
                                        ${todo.date}
                                    </span>
                                </div>
                            </div>
                        </div>

                        <!-- Actions Buttons -->
                        <div class="flex items-center space-x-1 opacity-90 sm:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button 
                                onclick="editTodo(${todo.id})" 
                                class="p-2 text-slate-400 hover:text-indigo-400 hover:bg-indigo-500/10 rounded-xl transition-all cursor-pointer"
                                title="編輯內容"
                            >
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button 
                                onclick="deleteTodo(${todo.id})" 
                                class="p-2 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-xl transition-all cursor-pointer"
                                title="刪除任務"
                            >
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // HTML Escape for XSS safety
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // On Load
        window.addEventListener('DOMContentLoaded', () => {
            updateDate();
            renderTodos();
        });
    </script>
</body>
</html>
